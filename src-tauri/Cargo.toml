[package]
name = "loopserve"
version = "0.1.1"
description = "LoopServe — looping media server desktop app"
authors = ["LoopServe contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "loopserve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
mime_guess = "2"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
bytes = "1"
thiserror = "2"
parking_lot = "0.12"
url = "2"
# Companion is plain HTTP on the LAN, but the updater plugin pulls rustls into the same
# build; pick the provider explicitly so Client::build() has one configured.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
